[project]
name = "plugin-dev-helper"
version = "0.1.0"
description = "插件开发 AI Agent - SDK 知识库与智能问答系统"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "chromadb>=0.4.22",
    "sentence-transformers>=2.2.2,<4.0.0",
    "langgraph>=0.0.20",
    "langchain-openai>=0.3.0",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
    "tree-sitter>=0.20.4",
    "tree-sitter-typescript>=0.20.3",
    "networkx>=3.2.1",
    "numpy>=1.24.0,<2.0.0",
    "torch>=2.2.0,<2.5.0",
    "transformers>=4.41.0,<5.0.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
]
observability = [
    "langfuse>=2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
# 项目采用扁平目录，不能依赖 setuptools 自动发现多个顶级包。
# 显式声明可避免干净的 CI 环境在 `pip install -e .` 阶段构建失败。
packages = [
    "agent",
    "app",
    "eval",
    "graph_builder",
    "knowledge_builder",
    "sdk_parser",
    "scripts",
    "vector_store",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
