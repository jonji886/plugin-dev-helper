<!doctype html>
<html lang="zh-CN">
  <body>
    <button id="load">获取数据</button>
    <script>
      document.getElementById("load").addEventListener("click", () => {
        window.parent.postMessage({ action: "getDesignJson" }, "*");
      });
      window.addEventListener("message", (event) => {
        if (event.data.action === "designJsonResult") {
          document.getElementById("load").textContent = event.data.data;
        }
      });
    </script>
  </body>
</html>
