name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-${{ runner.os }}-all-minilm-l6-v2
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: npm ci
      # 用 pytest 跑全量：unittest discover 只收集 TestCase 子类，会漏掉仓库里大量
      # pytest 风格（函数级）的测试，导致 CI 绿但覆盖远弱于本地。
      - run: python -m pytest tests/ -q
      - run: HF_HUB_OFFLINE=0 TRANSFORMERS_OFFLINE=0 python scripts/run_pipeline.py
      - run: HF_HUB_OFFLINE=0 TRANSFORMERS_OFFLINE=0 python scripts/check_retrieval_gate.py
      # MCP 工具级黄金评测：确定性断言，不调用 LLM，依赖上一步构建的 data/knowledge + data/graph + data/chroma
      - run: HF_HUB_OFFLINE=0 TRANSFORMERS_OFFLINE=0 python scripts/run_mcp_eval.py --repeat 3
      # MCP 多轮序列评测：验证跨步骤引用（上一步返回驱动下一步）
      - run: HF_HUB_OFFLINE=0 TRANSFORMERS_OFFLINE=0 python scripts/run_mcp_sequences.py
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
