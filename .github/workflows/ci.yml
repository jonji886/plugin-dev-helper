name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-${{ runner.os }}-all-minilm-l6-v2
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: npm ci
      - run: python -m unittest discover -s tests -v
      - run: HF_HUB_OFFLINE=0 TRANSFORMERS_OFFLINE=0 python scripts/run_pipeline.py
      - run: HF_HUB_OFFLINE=0 TRANSFORMERS_OFFLINE=0 python scripts/check_retrieval_gate.py
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
