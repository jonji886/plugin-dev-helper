rules:
  - id: KJL-VM-001
    platform: kujiale
    category: runtime
    scope: vm
    severity: critical
    title: VM 不允许使用 DOM
    description: VM 不属于浏览器页面环境，不能使用 document、window、localStorage 或 sessionStorage。
    detection:
      type: static_pattern
      patterns: [document.*, window.*, localStorage, sessionStorage]
    confidence: high
    suggestion: 将 DOM、窗口和浏览器存储操作放到 UI，通过消息与 VM 交互。
    references: [kujiale_plugin_runtime]
    keywords: [VM, DOM, document, window, localStorage, sessionStorage]
    score_category: runtime

  - id: KJL-VM-002
    platform: kujiale
    category: runtime
    scope: vm
    severity: critical
    title: VM 不允许直接发起浏览器网络请求
    description: VM 不应直接使用 fetch 或 XMLHttpRequest 发起浏览器网络请求。
    detection:
      type: static_pattern
      patterns: [fetch, XMLHttpRequest]
    confidence: high
    suggestion: 将网络请求放到 UI 或平台允许的 API 层，再通过 postMessage 传递结果。
    references: [kujiale_plugin_runtime]
    keywords: [VM, fetch, XMLHttpRequest, 网络请求]
    score_category: runtime

  - id: KJL-VM-003
    platform: kujiale
    category: runtime
    scope: vm
    severity: high
    title: VM 不支持延迟执行函数
    description: VM 运行环境不支持 setTimeout 和 setInterval。
    detection:
      type: static_pattern
      patterns: [setTimeout, setInterval]
    confidence: high
    suggestion: 移除 VM 中的定时器，将调度逻辑放到 UI 或改为平台支持的异步流程。
    references: [kujiale_plugin_runtime]
    keywords: [VM, setTimeout, setInterval, 定时器]
    score_category: runtime

  - id: KJL-VM-004
    platform: kujiale
    category: api_usage
    scope: vm
    severity: high
    title: 不允许直接修改 IDP 返回的只读对象
    description: IDP API 返回的部分对象可能经过 Object.freeze，不能假设可以直接修改。
    detection:
      type: heuristic_assignment
    confidence: medium
    suggestion: 不要修改 API 返回对象；需要扩展数据时创建新的普通对象或副本。
    references: [kujiale_plugin_runtime]
    keywords: [VM, IDP, Object.freeze, 只读对象, 返回对象]
    score_category: api_usage

  - id: KJL-VM-005
    platform: kujiale
    category: runtime
    scope: vm
    severity: medium
    title: VM 生产逻辑不能依赖 console
    description: VM 生产环境中的 console 可能为空实现，不应作为用户可见结果或核心反馈渠道。
    detection:
      type: static_pattern
      patterns: [console.log, console.error, console.warn]
    confidence: medium
    suggestion: 通过 VM → UI 的 postMessage 发送必要结果或调试信息。
    references: [kujiale_plugin_runtime]
    keywords: [VM, console, 调试, 日志]
    score_category: runtime

  - id: KJL-VM-006
    platform: kujiale
    category: error_handling
    scope: vm
    severity: high
    title: Promise 异常必须合理处理
    description: 明显的 IDP Promise 链应包含 catch 或其他明确的异常处理路径。
    detection:
      type: heuristic_promise_chain
    confidence: medium
    suggestion: 为 IDP Promise 链增加 .catch，或使用带 try/catch 的 await 流程处理异常。
    references: [kujiale_plugin_runtime]
    keywords: [VM, Promise, then, catch, 异常, 错误处理]
    score_category: error_handling

  - id: KJL-API-001
    platform: kujiale
    category: api_usage
    scope: api
    severity: high
    title: VM 只能调用知识库中确认的酷家乐 API
    description: VM 中的 IDP API 符号、namespace 和参数应能在当前 SDK 知识索引中确认。
    detection:
      type: usage_validator
    confidence: high
    suggestion: 使用 get_api / get_type 查询真实 API 后修正符号或参数。
    references: [sdk_knowledge_index]
    keywords: [API, IDP, SDK, namespace, 参数]
    score_category: api_usage
